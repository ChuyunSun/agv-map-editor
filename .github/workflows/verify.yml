name: Verify application and Docker

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified image to public sunchuyun/agv-map-editor
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build Debian image
        run: docker build --tag agv-map-editor:verify .
      - name: Verify startup, save, and persistent volume
        run: bash scripts/verify-image.sh
        env:
          IMAGE: agv-map-editor:verify
      - name: Publish verified image
        id: publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_TOKEN"
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username sunchuyun --password-stdin
          image="sunchuyun/agv-map-editor"
          tag="sha-${GITHUB_SHA}"
          docker tag agv-map-editor:verify "$image:$tag"
          docker push "$image:$tag"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag")"
          test -n "$digest"
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $digest from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pull public image anonymously on a fresh runner
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
        run: |
          test -n "$IMAGE"
          docker pull "$IMAGE"
      - name: Verify published image and persistence
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
        run: bash scripts/verify-image.sh
